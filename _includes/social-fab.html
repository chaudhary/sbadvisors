  <button type="button" class="sb-fab-toggle" id="sb-fab-toggle" aria-expanded="false" aria-controls="sb-fab-channels" aria-label="Open contact options">

    </svg>
  </button>
</div>
<script>
(function () {
  var fab = document.getElementById('sb-fab');
  var toggle = document.getElementById('sb-fab-toggle');
  if (!fab || !toggle) return;
  var links = fab.querySelectorAll('.sb-fab-channel');

  function setOpen(open) {
    fab.setAttribute('data-open', open ? 'true' : 'false');
    toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    toggle.setAttribute('aria-label', open ? 'Close contact options' : 'Open contact options');
    links.forEach(function (l) { l.setAttribute('tabindex', open ? '0' : '-1'); });
  }

  toggle.addEventListener('click', function (e) {
    e.stopPropagation();
    setOpen(fab.getAttribute('data-open') !== 'true');
  });
  document.addEventListener('click', function (e) {
    if (fab.getAttribute('data-open') === 'true' && !fab.contains(e.target)) setOpen(false);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && fab.getAttribute('data-open') === 'true') {
      setOpen(false);
      toggle.focus();
    }
  });
})();
</script>
