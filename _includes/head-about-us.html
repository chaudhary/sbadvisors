	<script>
		window.addEventListener('scroll', () => {
			const sections = document.querySelectorAll('.hero-1, .hero-2, .hero-3');
			const winH = window.innerHeight;

			sections.forEach(section => {
				const text = section.querySelector('.scroll-text');
				if (!text) return;

				const rect = section.getBoundingClientRect();
				const isMobile = window.innerWidth < 768;

				// Start animation when the center of the section aligns with the center of the screen
				const sectionCenter = rect.top + rect.height / 2;
				const screenCenter = winH / 2;

				// How far the section center is from the viewport center
				const offset = screenCenter - sectionCenter;

				// Progress value (-1 to 1 roughly)
				const progress = offset / winH;

				// Only run animation when section is near center
				if (Math.abs(progress) < 1.2) {
					// Adjust movement & speed
					const moveX = progress * (isMobile ? -200 : -400);
					text.style.transform = `translateX(${moveX}px)`;
					text.style.opacity = 1;
					text.style.transition = 'transform 0.1s linear';
					text.style.willChange = 'transform';
				}
			});
		});
	</script>
