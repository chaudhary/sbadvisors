name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "jekyll"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build
        run: bundle exec jekyll build --trace

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  notify-indexnow:
    name: Notify IndexNow (Bing, Yandex, etc.)
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main'
    env:
      INDEXNOW_HOST: www.sbadvisors.ae
      INDEXNOW_KEY: 25885c33c89143dea41341ca7a09f0c2
    steps:
      - name: Fetch sitemap and submit URLs
        run: |
          set -euo pipefail
          # Wait briefly for the deploy to propagate to the public origin.
          sleep 30

          SITEMAP_URL="https://${INDEXNOW_HOST}/sitemap.xml"
          KEY_LOCATION="https://${INDEXNOW_HOST}/${INDEXNOW_KEY}.txt"

          echo "Fetching sitemap from ${SITEMAP_URL}"
          curl -sSL --retry 3 --retry-delay 5 "$SITEMAP_URL" -o sitemap.xml

          # Extract <loc> URLs from the sitemap.
          grep -oE '<loc>[^<]+</loc>' sitemap.xml \
            | sed -E 's|<loc>(.*)</loc>|\1|' \
            | sort -u > urls.txt

          URL_COUNT=$(wc -l < urls.txt | tr -d ' ')
          echo "Found ${URL_COUNT} URLs in sitemap"

          if [ "$URL_COUNT" -eq 0 ]; then
            echo "::warning::Sitemap returned 0 URLs — skipping IndexNow submission"
            exit 0
          fi

          # Verify our key file is reachable before submitting (prevents 422s).
          KEY_HTTP=$(curl -sS -o /dev/null -w '%{http_code}' "$KEY_LOCATION")
          if [ "$KEY_HTTP" != "200" ]; then
            echo "::warning::Key file at ${KEY_LOCATION} returned HTTP ${KEY_HTTP} — skipping"
            exit 0
          fi

          # IndexNow accepts up to 10,000 URLs per request; we batch at 1,000 for safety.
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error

          host = os.environ["INDEXNOW_HOST"]
          key = os.environ["INDEXNOW_KEY"]
          key_loc = f"https://{host}/{key}.txt"

          with open("urls.txt") as f:
              urls = [u.strip() for u in f if u.strip()]

          BATCH = 1000
          for i in range(0, len(urls), BATCH):
              chunk = urls[i:i+BATCH]
              payload = json.dumps({
                  "host": host,
                  "key": key,
                  "keyLocation": key_loc,
                  "urlList": chunk,
              }).encode("utf-8")
              req = urllib.request.Request(
                  "https://api.indexnow.org/indexnow",
                  data=payload,
                  method="POST",
                  headers={"Content-Type": "application/json; charset=utf-8"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      print(f"Batch {i//BATCH + 1}: HTTP {resp.status} ({len(chunk)} URLs)")
              except urllib.error.HTTPError as e:
                  body = e.read().decode("utf-8", errors="replace")[:500]
                  # 200 OK, 202 Accepted: success. Anything else is a soft failure.
                  print(f"::warning::Batch {i//BATCH + 1} returned HTTP {e.code}: {body}")
              except urllib.error.URLError as e:
                  print(f"::warning::Batch {i//BATCH + 1} network error: {e.reason}")
          PY
